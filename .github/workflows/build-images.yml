name: Build and Push Container Images

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'CHANGELOG.md'
      - 'src/troshkad/**'
      - 'src/operator/**'
      - 'deploy/containerfiles/**'
      - 'scripts/import_kubevirt_storage.py'
      - 'scripts/collect_kubevirt_storage.py'
      - '.github/workflows/build-images.yml'

jobs:
  changes:
    runs-on: ubuntu-22.04
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
      operator: ${{ steps.check.outputs.operator }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          BEFORE="$PUSH_BEFORE"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          DIFF=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || echo "")
          echo "Files changed since last push:"
          echo "$DIFF"
          echo "backend=$(echo "$DIFF" | grep -qE '^src/backend/|^src/troshkad/|^src/troshka-vncd/|^src/operator/crds/|^src/operator/helpers/|^scripts/(import|collect)_kubevirt_storage\.py$|^deploy/containerfiles/Containerfile\.backend' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(echo "$DIFF" | grep -qE '^src/frontend/|^CHANGELOG\.md$|^deploy/containerfiles/Containerfile\.frontend' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "operator=$(echo "$DIFF" | grep -qE '^src/operator/|^\.github/workflows/build-images\.yml$' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set image tags
        id: tags
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"
          echo "sha_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build backend image
        run: |
          podman build --no-cache \
            -f deploy/containerfiles/Containerfile.backend \
            -t quay.io/redhat-gpte/troshka-backend:${{ steps.tags.outputs.sha_tag }} \
            -t quay.io/redhat-gpte/troshka-backend:latest \
            .

      - name: Tag version (if tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          podman tag \
            quay.io/redhat-gpte/troshka-backend:${{ steps.tags.outputs.sha_tag }} \
            quay.io/redhat-gpte/troshka-backend:${{ steps.tags.outputs.version_tag }}

      - name: Push to Quay.io
        run: |
          podman login -u="${{ secrets.QUAY_USERNAME }}" -p="${{ secrets.QUAY_PASSWORD }}" quay.io
          podman push quay.io/redhat-gpte/troshka-backend:${{ steps.tags.outputs.sha_tag }}
          podman push quay.io/redhat-gpte/troshka-backend:latest
          if [[ -n "${{ steps.tags.outputs.version_tag }}" ]]; then
            podman push quay.io/redhat-gpte/troshka-backend:${{ steps.tags.outputs.version_tag }}
          fi

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set image tags
        id: tags
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"
          echo "sha_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build frontend image
        env:
          TROSHKA_BUILD_VERSION: ${{ steps.tags.outputs.version_tag || steps.tags.outputs.sha_tag }}
        run: |
          podman build --no-cache \
            --build-arg "TROSHKA_BUILD_VERSION=$TROSHKA_BUILD_VERSION" \
            -f deploy/containerfiles/Containerfile.frontend \
            -t quay.io/redhat-gpte/troshka-frontend:${{ steps.tags.outputs.sha_tag }} \
            -t quay.io/redhat-gpte/troshka-frontend:latest \
            .

      - name: Tag version (if tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          podman tag \
            quay.io/redhat-gpte/troshka-frontend:${{ steps.tags.outputs.sha_tag }} \
            quay.io/redhat-gpte/troshka-frontend:${{ steps.tags.outputs.version_tag }}

      - name: Push to Quay.io
        run: |
          podman login -u="${{ secrets.QUAY_USERNAME }}" -p="${{ secrets.QUAY_PASSWORD }}" quay.io
          podman push quay.io/redhat-gpte/troshka-frontend:${{ steps.tags.outputs.sha_tag }}
          podman push quay.io/redhat-gpte/troshka-frontend:latest
          if [[ -n "${{ steps.tags.outputs.version_tag }}" ]]; then
            podman push quay.io/redhat-gpte/troshka-frontend:${{ steps.tags.outputs.version_tag }}
          fi

  build-operator:
    name: Build ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.operator == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: troshka-operator
            context: src/operator
          - image: troshka-dnsmasq
            context: src/operator/images/dnsmasq
          - image: troshka-gateway
            context: src/operator/images/gateway
          - image: troshka-tools
            context: src/operator/images/troshka-tools
          - image: troshka-bmc
            context: src/operator/images/bmc
          - image: troshka-vnc-proxy
            context: src/operator/images/vnc-proxy
          - image: troshka-ops-pod
            context: src/operator/images/ops-pod
            ocp_version: stable
          - image: troshka-terminal
            context: src/operator/images/terminal
            ocp_version: stable
    steps:
      - uses: actions/checkout@v7

      - name: Set image tags
        id: tags
        env:
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          echo "sha_tag=${COMMIT_SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "version_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Login to Quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: printf '%s' "$QUAY_PASSWORD" | podman login --username "$QUAY_USERNAME" --password-stdin quay.io

      - name: Build and push image
        env:
          IMAGE: ${{ matrix.image }}
          BUILD_CONTEXT: ${{ matrix.context }}
          OCP_VERSION: ${{ matrix.ocp_version || '' }}
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
          VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
        run: |
          image="quay.io/redhat-gpte/$IMAGE"
          build_args=()
          if [ -n "$OCP_VERSION" ]; then
            build_args+=(--build-arg "OCP_VERSION=$OCP_VERSION")
          fi
          podman build \
            -f "$BUILD_CONTEXT/Dockerfile" \
            "${build_args[@]}" \
            -t "$image:$SHA_TAG" \
            -t "$image:latest" \
            "$BUILD_CONTEXT"
          podman push "$image:$SHA_TAG"
          podman push "$image:latest"
          if [ -n "$VERSION_TAG" ]; then
            podman tag "$image:$SHA_TAG" "$image:$VERSION_TAG"
            podman push "$image:$VERSION_TAG"
          fi
