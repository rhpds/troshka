name: Build and Push Container Images

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'CHANGELOG.md'
      - 'src/troshkad/**'
      - 'src/operator/**'
      - 'deploy/containerfiles/**'
      - 'scripts/import_kubevirt_storage.py'
      - 'scripts/native_binding_retirement_cli.py'
      - 'scripts/collect_kubevirt_storage.py'
      - 'scripts/collector_*.py'
      - '.github/workflows/build-images.yml'

jobs:
  changes:
    runs-on: ubuntu-22.04
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
      operator: ${{ steps.check.outputs.operator }}
      force_all: ${{ steps.check.outputs.force_all }}
      carry_source: ${{ steps.check.outputs.carry_source }}
      carry_images: ${{ steps.check.outputs.carry_images }}
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          BEFORE="$PUSH_BEFORE"
          FORCE_ALL=false
          CARRY_SOURCE=""
          IS_RELEASE=false
          if [ "$IS_TAG" = "true" ]; then
            IS_RELEASE=true
            git fetch --tags --force
            PREV=$(git tag -l 'v*' --sort=-creatordate | awk -v cur="$REF_NAME" '$0 != cur { print; exit }')
            if [ -n "$PREV" ]; then
              BEFORE="$PREV"
              CARRY_SOURCE="$PREV"
            else
              BEFORE="HEAD~1"
              FORCE_ALL=true
            fi
            if git log -1 --pretty=%B | grep -q '\[rebuild-all\]'; then
              FORCE_ALL=true
            fi
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          DIFF=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || echo "")
          echo "Diff base: $BEFORE"
          echo "Files changed:"
          echo "$DIFF"
          BACKEND=false
          FRONTEND=false
          OPERATOR=false
          echo "$DIFF" | grep -qE '^src/backend/|^src/troshkad/|^src/troshka-vncd/|^src/operator/crds/|^src/operator/helpers/|^scripts/(import|collect)_kubevirt_storage\.py$|^scripts/collector_[^/]+\.py$|^scripts/native_binding_retirement_cli\.py$|^deploy/containerfiles/Containerfile\.backend' && BACKEND=true || true
          echo "$DIFF" | grep -qE '^src/frontend/|^CHANGELOG\.md$|^deploy/containerfiles/Containerfile\.frontend' && FRONTEND=true || true
          echo "$DIFF" | grep -qE '^src/operator/|^\.github/workflows/build-images\.yml$' && OPERATOR=true || true
          if [ "$FORCE_ALL" = true ]; then
            BACKEND=true
            FRONTEND=true
            OPERATOR=true
            CARRY_SOURCE=""
          fi
          CARRY='[]'
          if [ "$IS_RELEASE" = true ] && [ -n "$CARRY_SOURCE" ]; then
            images=()
            [ "$BACKEND" = true ] || images+=('"troshka-backend"')
            [ "$FRONTEND" = true ] || images+=('"troshka-frontend"')
            if [ "$OPERATOR" != true ]; then
              for image in troshka-operator troshka-dnsmasq troshka-gateway troshka-tools \
                troshka-bmc troshka-vnc-proxy troshka-ops-pod troshka-terminal; do
                images+=("\"$image\"")
              done
            fi
            if [ "${#images[@]}" -gt 0 ]; then
              CARRY="[$(IFS=,; echo "${images[*]}")]"
            fi
          fi
          {
            echo "backend=$BACKEND"
            echo "frontend=$FRONTEND"
            echo "operator=$OPERATOR"
            echo "force_all=$FORCE_ALL"
            echo "carry_source=$CARRY_SOURCE"
            echo "carry_images=$CARRY"
            echo "is_release=$IS_RELEASE"
          } >> "$GITHUB_OUTPUT"

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set image tags
        id: tags
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"
          echo "sha_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build backend image
        run: |
          podman build --no-cache \
            -f deploy/containerfiles/Containerfile.backend \
            -t quay.io/redhat-gpte/troshka-backend:${{ steps.tags.outputs.sha_tag }} \
            -t quay.io/redhat-gpte/troshka-backend:latest \
            .

      - name: Tag version (if tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          podman tag \
            quay.io/redhat-gpte/troshka-backend:${{ steps.tags.outputs.sha_tag }} \
            quay.io/redhat-gpte/troshka-backend:${{ steps.tags.outputs.version_tag }}

      - name: Push to Quay.io
        run: |
          podman login -u="${{ secrets.QUAY_USERNAME }}" -p="${{ secrets.QUAY_PASSWORD }}" quay.io
          podman push quay.io/redhat-gpte/troshka-backend:${{ steps.tags.outputs.sha_tag }}
          podman push quay.io/redhat-gpte/troshka-backend:latest
          if [[ -n "${{ steps.tags.outputs.version_tag }}" ]]; then
            podman push quay.io/redhat-gpte/troshka-backend:${{ steps.tags.outputs.version_tag }}
          fi

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set image tags
        id: tags
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"
          echo "sha_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build frontend image
        env:
          TROSHKA_BUILD_VERSION: ${{ steps.tags.outputs.version_tag || steps.tags.outputs.sha_tag }}
        run: |
          podman build --no-cache \
            --build-arg "TROSHKA_BUILD_VERSION=$TROSHKA_BUILD_VERSION" \
            -f deploy/containerfiles/Containerfile.frontend \
            -t quay.io/redhat-gpte/troshka-frontend:${{ steps.tags.outputs.sha_tag }} \
            -t quay.io/redhat-gpte/troshka-frontend:latest \
            .

      - name: Tag version (if tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          podman tag \
            quay.io/redhat-gpte/troshka-frontend:${{ steps.tags.outputs.sha_tag }} \
            quay.io/redhat-gpte/troshka-frontend:${{ steps.tags.outputs.version_tag }}

      - name: Push to Quay.io
        run: |
          podman login -u="${{ secrets.QUAY_USERNAME }}" -p="${{ secrets.QUAY_PASSWORD }}" quay.io
          podman push quay.io/redhat-gpte/troshka-frontend:${{ steps.tags.outputs.sha_tag }}
          podman push quay.io/redhat-gpte/troshka-frontend:latest
          if [[ -n "${{ steps.tags.outputs.version_tag }}" ]]; then
            podman push quay.io/redhat-gpte/troshka-frontend:${{ steps.tags.outputs.version_tag }}
          fi

  build-operator:
    name: Build ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: troshka-operator
            context: src/operator
          - image: troshka-dnsmasq
            context: src/operator/images/dnsmasq
          - image: troshka-gateway
            context: src/operator/images/gateway
          - image: troshka-tools
            context: src/operator/images/troshka-tools
          - image: troshka-bmc
            context: src/operator/images/bmc
          - image: troshka-vnc-proxy
            context: src/operator/images/vnc-proxy
          - image: troshka-ops-pod
            context: src/operator/images/ops-pod
            ocp_version: stable
          - image: troshka-terminal
            context: src/operator/images/terminal
            ocp_version: stable
    steps:
      - uses: actions/checkout@v7

      - name: Set image tags
        id: tags
        env:
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          echo "sha_tag=${COMMIT_SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "version_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Login to Quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: printf '%s' "$QUAY_PASSWORD" | podman login --username "$QUAY_USERNAME" --password-stdin quay.io

      - name: Build and push image
        env:
          IMAGE: ${{ matrix.image }}
          BUILD_CONTEXT: ${{ matrix.context }}
          OCP_VERSION: ${{ matrix.ocp_version || '' }}
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
          VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
        run: |
          image="quay.io/redhat-gpte/$IMAGE"
          build_args=()
          if [ -n "$OCP_VERSION" ]; then
            build_args+=(--build-arg "OCP_VERSION=$OCP_VERSION")
          fi
          podman build \
            -f "$BUILD_CONTEXT/Dockerfile" \
            "${build_args[@]}" \
            -t "$image:$SHA_TAG" \
            -t "$image:latest" \
            "$BUILD_CONTEXT"
          podman push "$image:$SHA_TAG"
          podman push "$image:latest"
          if [ -n "$VERSION_TAG" ]; then
            podman tag "$image:$SHA_TAG" "$image:$VERSION_TAG"
            podman push "$image:$VERSION_TAG"
          fi

  carry-forward:
    name: Carry ${{ matrix.image }}
    needs: changes
    if: >
      needs.changes.outputs.is_release == 'true' &&
      needs.changes.outputs.carry_source != '' &&
      needs.changes.outputs.carry_images != '[]'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.changes.outputs.carry_images) }}
    steps:
      - name: Login to Quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: printf '%s' "$QUAY_PASSWORD" | podman login --username "$QUAY_USERNAME" --password-stdin quay.io

      - name: Retag previous release onto this tag
        env:
          IMAGE: ${{ matrix.image }}
          SOURCE_TAG: ${{ needs.changes.outputs.carry_source }}
          VERSION_TAG: ${{ github.ref_name }}
          SHA_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="quay.io/redhat-gpte/$IMAGE"
          short_sha="${SHA_TAG:0:8}"
          echo "Carrying $image:$SOURCE_TAG → $VERSION_TAG (+ $short_sha)"
          skopeo copy --all "docker://$image:$SOURCE_TAG" "docker://$image:$VERSION_TAG"
          skopeo copy --all "docker://$image:$SOURCE_TAG" "docker://$image:$short_sha"
