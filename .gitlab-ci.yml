---
include:
  - project: enterprise-pipelines/gitlab-ci/includes
    file: SAST/sonarqube.yml

stages:
  - test
  - static-analysis

# ALM shared runners OOM (~exit 137) on the full backend suite + pytest-cov in
# one container (~6k tests). Shard by test file across parallel jobs; Sonar
# merges the per-shard coverage XMLs.
.test-backend-shard:
  stage: test
  image: python:3.13
  # Modest requests: 8×8Gi was starving the shared ALM node and still OOM'd.
  # Prefer more shards with smaller peak RSS over one fat pod.
  variables:
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
  parallel: 16
  script:
    - cd src/backend
    - pip install --upgrade pip
    - pip install ".[dev]"
    - |
      set -euo pipefail
      # Largest files first, then round-robin across shards.
      # Known ALM OOM under full --source=app: handled by test-backend-heavy.
      skip_files=(tests/test_kubevirt_coverage.py)
      files=()
      while IFS= read -r line; do
        f="${line##* }"
        [ -n "$f" ] && [ -f "$f" ] || continue
        skip=0
        for s in "${skip_files[@]}"; do
          [ "$f" = "$s" ] && skip=1 && break
        done
        [ "$skip" -eq 0 ] && files+=("$f")
      done < <(find tests -name 'test_*.py' -print0 | xargs -0 wc -l | grep -v ' total$' | sort -nr)
      shard=()
      for i in "${!files[@]}"; do
        if (( i % CI_NODE_TOTAL == CI_NODE_INDEX - 1 )); then
          shard+=("${files[$i]}")
        fi
      done
      echo "Shard ${CI_NODE_INDEX}/${CI_NODE_TOTAL}: ${#shard[@]} of ${#files[@]} test files (size-balanced)"
      if [ "${#shard[@]}" -eq 0 ]; then
        echo "No files in this shard — writing empty coverage stub"
        printf '%s\n' '<?xml version="1.0" ?><coverage version="7.0" timestamp="0" lines-valid="0" lines-covered="0" line-rate="0"><sources/><packages/></coverage>' \
          > "../../coverage-${CI_NODE_INDEX}.xml"
        exit 0
      fi
      # One file per coverage process; disable pytest-cov plugin (coverage CLI only).
      rm -f .coverage .coverage.*
      fail=0
      batch_num=0
      for f in "${shard[@]}"; do
        batch_num=$((batch_num + 1))
        n=$(wc -l < "$f" | tr -d ' ')
        echo "  batch ${batch_num}: 1 file (~${n} lines) $f"
        if ! COVERAGE_CORE=ctrace coverage run --parallel-mode --source=app \
            -m pytest "$f" -q --tb=line -p no:cov -p no:cacheprovider; then
          fail=1
        fi
      done
      coverage combine
      coverage xml -o "../../coverage-${CI_NODE_INDEX}.xml"
      if [ "$fail" -ne 0 ]; then
        echo "One or more pytest batches failed in this shard"
        exit 1
      fi
    - cd ../..
    - sed -i 's|<source>app</source>|<source>src/backend/app</source>|' "coverage-${CI_NODE_INDEX}.xml"
  artifacts:
    paths:
      - coverage-*.xml
    expire_in: 1 hour
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  tags:
    - itup-alm-x86

test-backend:
  extends: .test-backend-shard

# Isolated job for files that balloon RSS even without coverage (~6GB local for
# the full module). One test per subprocess so RSS is released between cases;
# 8Gi headroom for import spikes. Sonar coverage for kubevirt comes from other
# shard files.
test-backend-heavy:
  stage: test
  image: python:3.13
  variables:
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
  script:
    - cd src/backend
    - pip install --upgrade pip
    - pip install ".[dev]"
    - |
      set -euo pipefail
      f=tests/test_kubevirt_coverage.py
      echo "Heavy file (no cov, one test per process): $f"
      pytest --collect-only -q "$f" -p no:cov | grep '::' > /tmp/heavy-tests.txt || true
      total=$(wc -l < /tmp/heavy-tests.txt | tr -d ' ')
      echo "Collected ${total} tests"
      fail=0
      batch_num=0
      while IFS= read -r t; do
        [ -z "$t" ] && continue
        batch_num=$((batch_num + 1))
        echo "  batch ${batch_num}/${total}: $t"
        if ! pytest "$t" -q --tb=line -p no:cov -p no:cacheprovider; then
          fail=1
        fi
      done < /tmp/heavy-tests.txt
      if [ "$fail" -ne 0 ]; then
        echo "One or more heavy batches failed"
        exit 1
      fi
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  tags:
    - itup-alm-x86

test-operator:
  stage: test
  image: python:3.13
  script:
    - cd src/operator
    - pip install --upgrade pip
    - pip install kubernetes kopf pytest pytest-cov pytest-timeout
    - pytest tests/ --cov-config=.coveragerc --cov --cov-report=xml:../../operator-coverage.xml -v || true
    - cd ../..
    - sed -i 's|<source>handlers</source>|<source>src/operator/handlers</source>|' operator-coverage.xml || true
    - sed -i 's|<source>helpers</source>|<source>src/operator/helpers</source>|' operator-coverage.xml || true
    - sed -i 's|<source>images</source>|<source>src/operator/images</source>|' operator-coverage.xml || true
    - sed -i 's|<source>\./operator\.py</source>|<source>src/operator</source>|' operator-coverage.xml || true
    - sed -i 's|<source>operator\.py</source>|<source>src/operator</source>|' operator-coverage.xml || true
  artifacts:
    paths:
      - operator-coverage.xml
    expire_in: 1 hour
  tags:
    - itup-alm-x86

test-troshkad:
  stage: test
  image: python:3.13
  script:
    - cd src/troshkad
    - pip install pytest pytest-cov
    - pytest tests/ --cov=troshkad --cov-report=xml:../../troshkad-coverage.xml -v || true
    - cd ../..
    - sed -i 's|<source>troshkad</source>|<source>src/troshkad</source>|' troshkad-coverage.xml || true
  artifacts:
    paths:
      - troshkad-coverage.xml
    expire_in: 1 hour
  tags:
    - itup-alm-x86

sonarqube:
  variables:
    SONAR_PROJECT_KEY: "com.redhat.rhpds.troshka"
  needs:
    - job: test-backend
    - job: test-backend-heavy
    - job: test-operator
      optional: true
    - job: test-troshkad
      optional: true
  tags:
    - itup-alm-x86
