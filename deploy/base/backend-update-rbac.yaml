apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: troshka-self-update
  namespace: troshka
  labels:
    app.kubernetes.io/name: troshka-backend
    app.kubernetes.io/component: backend
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["troshka-backend", "troshka-frontend"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: troshka-self-update
  namespace: troshka
  labels:
    app.kubernetes.io/name: troshka-backend
    app.kubernetes.io/component: backend
subjects:
  - kind: ServiceAccount
    name: troshka-backend
    namespace: troshka
roleRef:
  kind: Role
  name: troshka-self-update
  apiGroup: rbac.authorization.k8s.io
