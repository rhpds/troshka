{{- if .Values.deploy }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: troshka-config
  namespace: {{ include "troshka.namespace" . }}
  labels:
    {{- include "troshka.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  config.yaml: |
    app:
      name: troshka
      port: 8200
      host: "0.0.0.0"
      log_level: info
      root_path: ""
      {{- if and .Values.ingress.enabled .Values.ingress.host }}
      external_url: "https://{{ .Values.ingress.host }}"
      {{- else if .Values.route.host }}
      external_url: "https://{{ .Values.route.host }}"
      {{- else }}
      external_url: ""
      {{- end }}
    auth:
      oauth_enabled: {{ .Values.auth.oauthEnabled }}
      jwt_algorithm: "HS256"
      admin_users: {{ .Values.auth.adminUsers | quote }}
      operator_users: {{ .Values.auth.operatorUsers | quote }}
      allowed_users: {{ .Values.auth.allowedUsers | quote }}
      allowed_groups: {{ .Values.auth.allowedGroups | quote }}
      admin_groups: {{ .Values.auth.adminGroups | quote }}
      operator_groups: {{ .Values.auth.operatorGroups | quote }}
    {{- if or .Values.s4.deploy .Values.s3.endpoint .Values.s3.useAws }}
    s3:
      {{- if .Values.s3.endpoint }}
      endpoint_url: {{ .Values.s3.endpoint | quote }}
      {{- else if .Values.s4.deploy }}
      endpoint_url: "http://troshka-s4.{{ include "troshka.namespace" . }}.svc:7480"
      {{- end }}
      bucket: {{ .Values.s3.bucket | quote }}
    {{- end }}
    defaults:
      run_timer_hours: {{ .Values.defaults.runTimerHours }}
      lifetime_days: {{ .Values.defaults.lifetimeDays }}
      max_vms_per_project: {{ .Values.defaults.maxVmsPerProject }}
      max_projects_per_user: {{ .Values.defaults.maxProjectsPerUser }}
      user_library_quota_gb: {{ .Values.defaults.userLibraryQuotaGb }}
    redis:
      {{- if .Values.redis.url }}
      url: {{ .Values.redis.url | quote }}
      {{- else if .Values.redis.deploy }}
      url: "redis://troshka-redis.{{ include "troshka.namespace" . }}.svc:6379/0"
      {{- else }}
      url: "redis://localhost:6379/0"
      {{- end }}
    overcommit:
      cpu_ratio: {{ .Values.overcommit.cpuRatio }}
      ram_ratio: {{ .Values.overcommit.ramRatio }}
    ocp:
      preview_versions_enabled: {{ .Values.ocp.previewVersionsEnabled | default false }}
    workloads:
      default_ee_image: {{ .Values.workloads.defaultEeImage | quote }}
      cache_root: {{ .Values.workloads.cacheRoot | quote }}
      disk_budget_gb: {{ .Values.workloads.diskBudgetGb }}
      run_retention_days: {{ .Values.workloads.runRetentionDays }}
      agnosticv_branch: {{ .Values.workloads.agnosticvBranch | quote }}
      agnosticd_v2_url: {{ .Values.workloads.agnosticdV2Url | quote }}
      default_refs:
        agnosticd-v2: {{ .Values.workloads.defaultRefs.agnosticdV2 | quote }}
        agnosticd: {{ .Values.workloads.defaultRefs.agnosticd | quote }}
        core_workloads: {{ .Values.workloads.defaultRefs.coreWorkloads | quote }}
        demo_workloads: {{ .Values.workloads.defaultRefs.demoWorkloads | quote }}
        namespaced_workloads: {{ .Values.workloads.defaultRefs.namespacedWorkloads | quote }}
{{- end }}
