{{- if and .Values.deploy .Values.route.enabled }}
{{- /* Wire Route to ose-oauth-proxy only for OpenShift SSO (not EKS oauth2-proxy). */}}
{{- $ocpOauth := and .Values.auth.oauthEnabled (not (.Values.auth.oauth2Proxy.enabled | default false)) }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: troshka
  namespace: {{ include "troshka.namespace" . }}
  labels:
    {{- include "troshka.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    haproxy.router.openshift.io/timeout: 3600s
spec:
  {{- if .Values.route.host }}
  host: {{ .Values.route.host }}
  {{- end }}
  to:
    kind: Service
    {{- if $ocpOauth }}
    name: troshka-oauth-proxy
    {{- else }}
    name: troshka-frontend
    {{- end }}
  port:
    {{- if $ocpOauth }}
    targetPort: proxy
    {{- else }}
    targetPort: http
    {{- end }}
  tls:
    {{- if $ocpOauth }}
    termination: reencrypt
    {{- else }}
    termination: edge
    {{- end }}
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
