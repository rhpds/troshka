{{- if .Values.deploy }}
apiVersion: batch/v1
kind: Job
metadata:
  name: troshka-migrate-{{ .Release.Revision }}
  namespace: {{ include "troshka.namespace" . }}
  labels:
    {{- include "troshka.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: troshka-migrate
    spec:
      restartPolicy: Never
      {{- if .Values.postgres.deploy }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "troshka.backendImage" . }}
          command: ["bash", "-c"]
          args:
            - |
              echo "Waiting for PostgreSQL..."
              until bash -c 'echo > /dev/tcp/troshka-postgres/5432' 2>/dev/null; do
                sleep 2
              done
              echo "PostgreSQL is ready"
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "troshka.backendImage" . }}
          command: ["bash", "-c"]
          args:
            - |
              set -eu
              cd /opt/app-root/src
              if [ -n "$TROSHKA_INITIAL_ADMIN" ]; then
                python3 -m app.services.database_access --prepare-db --admin "$TROSHKA_INITIAL_ADMIN"
              else
                python3 -m app.services.database_access --prepare-db
              fi
          env:
            - name: TROSHKA_INITIAL_ADMIN
              value: {{ .Values.auth.initialAdmin | default "" | quote }}
            - name: TROSHKA_DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: troshka-secrets
                  key: database-url
          volumeMounts:
            - name: config
              mountPath: /opt/app-root/src/config/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: troshka-config
{{- end }}
