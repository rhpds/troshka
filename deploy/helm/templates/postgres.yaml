{{- if and .Values.deploy .Values.postgres.deploy }}
{{- $flavor := .Values.postgres.envFlavor | default "rhel" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: troshka-postgres
  namespace: {{ include "troshka.namespace" . }}
  labels:
    {{- include "troshka.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: troshka-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: troshka-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: troshka-postgres
        app.kubernetes.io/component: database
    spec:
      {{- include "troshka.controlPlaneAffinity" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            {{- if eq $flavor "docker" }}
            - name: POSTGRES_USER
              value: troshka
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: troshka-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: troshka
            # Keep data on the PVC path used by the RHEL image layout.
            - name: PGDATA
              value: /var/lib/pgsql/data/pgdata
            {{- else }}
            - name: POSTGRESQL_USER
              value: troshka
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: troshka-secrets
                  key: postgres-password
            - name: POSTGRESQL_DATABASE
              value: troshka
            # Sized to the fleet: (workers * worker pool) + (backend * (pool + overflow)) + reserve.
            # Auto-scales when worker.replicas changes, so a large fleet never
            # exhausts the DB (the root cause of "remaining connection slots reserved").
            - name: POSTGRESQL_MAX_CONNECTIONS
              value: {{ add (add (mul .Values.worker.replicas .Values.worker.dbPoolSize) (mul .Values.backend.replicas (add .Values.backend.dbPoolSize .Values.backend.dbMaxOverflow))) 20 | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "troshka"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              # Headroom for a large max_connections (each connection costs memory).
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: troshka-postgres
  namespace: {{ include "troshka.namespace" . }}
  labels:
    {{- include "troshka.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: troshka-postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
