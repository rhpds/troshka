{{- if and .Values.deploy .Values.s4.deploy }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: troshka-s4
  namespace: {{ include "troshka.namespace" . }}
  labels:
    {{- include "troshka.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: troshka-s4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: troshka-s4
        app.kubernetes.io/component: storage
    spec:
      {{- if .Values.s4.runAsRoot }}
      # EBS CSI volumes are root-owned; s4 needs write under /var/lib/ceph/radosgw.
      # Do not enable on OpenShift (restricted SCC forbids runAsUser: 0).
      securityContext:
        fsGroup: 0
        runAsUser: 0
      {{- end }}
      # Create the S3 user against sqlite BEFORE rgw starts. A parallel Job that
      # mounts the same PVC races the running rgw process and aborts.
      initContainers:
        - name: ensure-s3-user
          image: {{ .Values.s4.image }}
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              mkdir -p /var/lib/ceph/radosgw/{db,buckets,tmp}
              # Prefer uid lookup; fall back to access-key (create can leave key
              # registered while uid info briefly fails / after partial runs).
              if radosgw-admin user info --uid=troshka >/dev/null 2>&1 \
                || radosgw-admin user info --access-key="$S3_ACCESS_KEY" >/dev/null 2>&1; then
                echo "Troshka S3 user already present"
              else
                set +e
                OUT=$(radosgw-admin user create --uid=troshka --display-name="Troshka" \
                  --access-key="$S3_ACCESS_KEY" --secret-key="$S3_SECRET_KEY" 2>&1)
                RC=$?
                set -e
                if [[ $RC -eq 0 ]]; then
                  echo "Created user troshka"
                elif echo "$OUT" | grep -qi 'duplicate key'; then
                  echo "Access key already registered — treating as success"
                else
                  echo "$OUT" >&2
                  exit "$RC"
                fi
              fi
              if radosgw-admin user info --uid=s4admin >/dev/null 2>&1; then
                radosgw-admin user rm --uid=s4admin || true
                echo "Removed default s4admin user"
              fi
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: troshka-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: troshka-secrets
                  key: s3-secret-key
          volumeMounts:
            - name: data
              mountPath: /var/lib/ceph/radosgw
              subPath: radosgw
      containers:
        - name: s4
          image: {{ .Values.s4.image }}
          ports:
            - containerPort: 7480
              name: s3
            - containerPort: 5000
              name: ui
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: troshka-secrets
                  key: s3-access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: troshka-secrets
                  key: s3-secret-key
          volumeMounts:
            - name: data
              mountPath: /data
            - name: data
              mountPath: /var/lib/ceph/radosgw
              subPath: radosgw
          readinessProbe:
            tcpSocket:
              port: 7480
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 16Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: troshka-s4-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: troshka-s4-data
  namespace: {{ include "troshka.namespace" . }}
  labels:
    {{- include "troshka.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.s4.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: troshka-s4
  namespace: {{ include "troshka.namespace" . }}
  labels:
    {{- include "troshka.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  selector:
    app.kubernetes.io/name: troshka-s4
  ports:
    - port: 7480
      targetPort: 7480
      name: s3
    - port: 5000
      targetPort: 5000
      name: ui
{{- if and .Values.s4.expose.enabled .Values.ingress.enabled .Values.ingress.host }}
---
# Public S3 API for troshkad hosts (EC2). IP-allowlisted; no basic auth (SigV4).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: troshka-s4
  namespace: {{ include "troshka.namespace" . }}
  labels:
    {{- include "troshka.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    {{- $cidrs := .Values.s4.expose.allowedCidrs | default list }}
    {{- if $cidrs }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ $cidrs | join "," | quote }}
    {{- end }}
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ printf "s4.%s" .Values.ingress.host | quote }}
      secretName: troshka-s4-tls
  {{- end }}
  rules:
    - host: {{ printf "s4.%s" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: troshka-s4
                port:
                  name: s3
{{- end }}
{{- if .Values.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: troshka-s4
  namespace: {{ include "troshka.namespace" . }}
  labels:
    {{- include "troshka.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  to:
    kind: Service
    name: troshka-s4
  port:
    targetPort: s3
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
---
# Bucket create only — no PVC mount (avoids sqlite race with running rgw).
apiVersion: batch/v1
kind: Job
metadata:
  name: troshka-s4-init
  namespace: {{ include "troshka.namespace" . }}
  labels:
    {{- include "troshka.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Skip
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      {{- if .Values.s4.runAsRoot }}
      securityContext:
        runAsUser: 0
      {{- end }}
      initContainers:
        - name: wait-for-s4
          image: {{ include "troshka.backendImage" . }}
          command: ["bash", "-c"]
          args:
            - |
              echo "Waiting for S4..."
              until bash -c 'echo > /dev/tcp/troshka-s4/7480' 2>/dev/null; do
                sleep 2
              done
              echo "S4 is ready"
      containers:
        - name: setup-bucket
          image: {{ include "troshka.backendImage" . }}
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              BUCKET="{{ .Values.s3.bucket }}"
              DATE=$(date -u +"%a, %d %b %Y %H:%M:%S GMT")
              SIG=$(printf "PUT\n\n\n${DATE}\n/${BUCKET}" | openssl dgst -sha1 -hmac "$S3_SECRET_KEY" -binary | base64)
              RESP=$(curl -s -o /tmp/s3.out -w "%{http_code}" -X PUT "http://troshka-s4:7480/${BUCKET}" \
                -H "Date: ${DATE}" \
                -H "Authorization: AWS ${S3_ACCESS_KEY}:${SIG}" || true)
              # 200 = created; 409 = already exists
              if [[ "${RESP}" == "200" || "${RESP}" == "409" ]]; then
                echo "Bucket ${BUCKET} ready (HTTP ${RESP})"
                exit 0
              fi
              echo "error: bucket create failed HTTP ${RESP}" >&2
              cat /tmp/s3.out >&2 || true
              exit 1
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: troshka-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: troshka-secrets
                  key: s3-secret-key
{{- end }}
