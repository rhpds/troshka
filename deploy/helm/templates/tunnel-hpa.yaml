{{- if and .Values.deploy .Values.tunnel.enabled .Values.tunnel.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: troshka-tunnel
  namespace: {{ include "troshka.namespace" . }}
  labels:
    {{- include "troshka.labels" . | nindent 4 }}
    app.kubernetes.io/component: tunnel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: troshka-tunnel
  minReplicas: {{ .Values.tunnel.hpa.minReplicas }}
  maxReplicas: {{ .Values.tunnel.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.tunnel.hpa.targetCPUUtilization }}
{{- end }}
