# Persistent dev app: Argo follows main; application images follow latest.
# Infrastructure images stay versioned independently.
# Supply auth.initialAdmin explicitly on first installation; never put secrets here.
namespace:
  create: false
  name: troshka-dev
backend:
  image:
    repository: quay.io/redhat-gpte/troshka-backend
    tag: latest
frontend:
  image:
    repository: quay.io/redhat-gpte/troshka-frontend
    tag: latest
route:
  host: troshka.apps.ocpvdev01.dal13.infra.demo.redhat.com
auth:
  oauthEnabled: true
  oauthImage: image-registry.openshift-image-registry.svc:5000/troshka-dev/oauth-proxy:v2026.11.13-170117-dev
postgres:
  deploy: true
  image: image-registry.openshift-image-registry.svc:5000/troshka-dev/postgres:v2026.11.13-170117-dev
  storageSize: 10Gi
redis:
  deploy: true
  image: image-registry.openshift-image-registry.svc:5000/troshka-dev/redis:v2026.11.13-170117-dev
s4:
  deploy: true
  image: image-registry.openshift-image-registry.svc:5000/troshka-dev/s4:v2026.11.13-170117-dev-compatible
  storageSize: 50Gi
worker:
  replicas: 2
tunnel:
  replicas: 1
  hpa:
    enabled: false
affinity:
  avoidNodes: []
appUpdate:
  mode: disabled

# Match live troshka-dev: capture on, quotas off. Domain origin_admission stays
# in the Argo/profile values for the enrolled collection domain.
nativeOrigin:
  captureEnabled: true
