deploy: true

namespace:
  create: true
  name: troshka

backend:
  image:
    repository: quay.io/redhat-gpte/troshka-backend
    tag: production
  replicas: 1
  # DB pool per backend process (handles concurrent HTTP). Postgres
  # max_connections is auto-sized from these + the worker fleet (see postgres.yaml).
  dbPoolSize: 10
  dbMaxOverflow: 20
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

frontend:
  image:
    repository: quay.io/redhat-gpte/troshka-frontend
    tag: production
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

route:
  host: ""
  tls: edge

auth:
  oauthEnabled: false
  adminUsers: ""
  operatorUsers: ""
  allowedUsers: ""
  allowedGroups: ""
  adminGroups: ""
  operatorGroups: ""

secrets:
  databaseUrl: ""
  jwtSecret: ""
  encryptionKey: ""
  s3AccessKey: ""
  s3SecretKey: ""

database:
  url: ""
  # Recycle idle connections after this many seconds so bursts don't leave
  # connections parked idle for hours.
  poolRecycle: 1800

postgres:
  deploy: false
  image: registry.redhat.io/rhel9/postgresql-16:latest
  storageSize: 10Gi
  password: ""

s3:
  bucket: troshka-images
  endpoint: ""

s4:
  deploy: false
  image: quay.io/rh-aiservices-bu/s4:latest
  storageSize: 2Ti

defaults:
  runTimerHours: 8
  lifetimeDays: 30
  maxVmsPerProject: 20
  maxProjectsPerUser: 10
  userLibraryQuotaGb: 500

overcommit:
  cpuRatio: 4.0
  ramRatio: 1.5

redis:
  deploy: true
  image: registry.redhat.io/rhel9/redis-7:latest
  url: ""

worker:
  replicas: 100
  # Each RQ worker runs one job at a time, so a tiny pool is plenty. Postgres
  # max_connections scales with replicas * dbPoolSize (see postgres.yaml), so a
  # large fleet no longer exhausts the DB.
  dbPoolSize: 2
  dbMaxOverflow: 0
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
