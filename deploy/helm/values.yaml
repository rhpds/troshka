deploy: true

namespace:
  create: true
  name: troshka

# Soft scheduling for control-plane pods (backend/frontend/postgres/redis).
# See templates/_helpers.tpl troshka.controlPlaneAffinity.
affinity:
  # Prefer spreading control-plane components across nodes (blast-radius).
  spreadControlPlane: true
  # Prefer avoiding these node hostnames (known flaky). Soft — not a hard ban.
  avoidNodes:
    - ocp-infra01-worker04

backend:
  image:
    repository: quay.io/redhat-gpte/troshka-backend
    tag: production
  replicas: 1
  # DB pool per backend process (handles concurrent HTTP). Postgres
  # max_connections is auto-sized from these + the worker fleet (see postgres.yaml).
  dbPoolSize: 10
  dbMaxOverflow: 20
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

frontend:
  image:
    repository: quay.io/redhat-gpte/troshka-frontend
    tag: production
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

route:
  # OpenShift Routes (disable on vanilla Kubernetes / EKS).
  enabled: true
  host: ""
  tls: edge

ingress:
  # Kubernetes Ingress (enable on EKS / vanilla Kubernetes).
  enabled: false
  className: nginx
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: troshka-tls  # pragma: allowlist secret
    # When set, adds cert-manager.io/cluster-issuer annotation (Let's Encrypt).
    clusterIssuer: ""

auth:
  oauthEnabled: false
  # Edge basic auth (nginx Ingress). Used on public EKS quickstarts so the UI
  # is not open to the internet; app still runs in oauth-off / auto-admin mode
  # behind the edge password.
  basicAuth:
    enabled: false
    username: admin
    password: ""
    secretName: troshka-basic-auth  # pragma: allowlist secret
  # Generic oauth2-proxy (OIDC / Cognito) for EKS --production.
  # Mutually exclusive with OpenShift ose-oauth-proxy (oauth.yaml): that path
  # requires route.enabled + oauthEnabled and ignores oauth2Proxy.
  # Backend auth.oauth_enabled still comes from oauthEnabled for both SSO modes.
  oauth2Proxy:
    enabled: false
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    clientId: ""
    clientSecret: ""
    oidcIssuerUrl: ""
    redirectUrl: ""
    cookieSecret: ""
    emailDomains:
      - "*"
    # Extra skip-auth path regexes (in addition to health/ws defaults).
    skipAuthRegexes: []
  adminUsers: ""
  operatorUsers: ""
  allowedUsers: ""
  allowedGroups: ""
  adminGroups: ""
  operatorGroups: ""

# Offer OCP 5.x (dev-preview) in the New Project / cluster version dropdown.
ocp:
  previewVersionsEnabled: true

secrets:
  databaseUrl: ""
  jwtSecret: ""
  encryptionKey: ""
  s3AccessKey: ""
  s3SecretKey: ""

database:
  url: ""
  # Recycle idle connections after this many seconds so bursts don't leave
  # connections parked idle for hours.
  poolRecycle: 1800

postgres:
  deploy: false
  image: registry.redhat.io/rhel9/postgresql-16:latest
  # rhel = POSTGRESQL_* env (default). docker = POSTGRES_* for Docker Official / ECR public.
  envFlavor: rhel
  storageSize: 10Gi
  password: ""

s3:
  bucket: troshka-images
  endpoint: ""
  # When true (and s4.deploy false), emit s3 config without endpoint_url (real AWS S3).
  useAws: false

s4:
  deploy: false
  image: quay.io/rh-aiservices-bu/s4:latest
  storageSize: 2Ti
  # EKS EBS CSI volumes are root-owned; leave false on OpenShift (restricted SCC).
  runAsRoot: false
  # Public Ingress for troshkad hosts (EKS). Pods keep using ClusterIP.
  expose:
    enabled: false
    # CIDRs allowed to hit the S4 Ingress (host EIPs as /32). Empty → 127.0.0.1/32 (deny-all until seed).
    allowedCidrs: []

defaults:
  runTimerHours: 8
  lifetimeDays: 30
  maxVmsPerProject: 20
  maxProjectsPerUser: 10
  userLibraryQuotaGb: 500

overcommit:
  cpuRatio: 4.0
  ramRatio: 1.5

redis:
  deploy: true
  image: registry.redhat.io/rhel9/redis-7:latest
  url: ""

# Workloads subsystem (ad-hoc / catalog Ansible runs). Must be present in the
# mounted ConfigMap — the image's config.yaml is overwritten by this CM.
workloads:
  defaultEeImage: quay.io/agnosticd/ee-multicloud:chained-latest
  cacheRoot: /var/lib/troshka/workload-cache
  diskBudgetGb: 20
  runRetentionDays: 30
  agnosticvBranch: master
  agnosticdV2Url: https://github.com/rhpds/agnosticd-v2.git
  defaultRefs:
    agnosticdV2: main
    agnosticd: development
    coreWorkloads: main
    demoWorkloads: main
    namespacedWorkloads: main

worker:
  replicas: 100
  # Each RQ worker runs one job at a time, so a tiny pool is plenty. Postgres
  # max_connections scales with replicas * dbPoolSize (see postgres.yaml), so a
  # large fleet no longer exhausts the DB.
  dbPoolSize: 2
  dbMaxOverflow: 0
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
