<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <style>
      .title { font: 700 22px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .subtitle { font: 400 13px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #555; }
      .h { font: 700 13px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .t { font: 500 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #222; }
      .t-inv { font: 600 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .s { font: 400 11px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #555; }
      .tiny { font: 400 10px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #555; }
      .vm { font: 700 11px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .lbl { font: 600 11px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #222; }
      .arrow { font: 500 10px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #444; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C9190B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#232F3E"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#FAFBFC"/>

  <text x="40" y="42" class="title">Troshka on AWS — Reference Architecture</text>
  <text x="40" y="64" class="subtitle">Control plane · nested-virt compute hosts · S3 pattern store · EIP/VPC placement · portal &amp; console path</text>

  <!-- Users -->
  <rect x="40" y="100" width="200" height="280" rx="10" fill="#FFFFFF" stroke="#D2D2D2" stroke-width="1.5"/>
  <rect x="40" y="100" width="200" height="36" rx="10" fill="#F0F0F0"/>
  <rect x="40" y="120" width="200" height="16" fill="#F0F0F0"/>
  <text x="140" y="124" text-anchor="middle" class="h">Users &amp; Access</text>

  <rect x="60" y="152" width="160" height="56" rx="6" fill="#FFF5F5" stroke="#C9190B" stroke-width="1.5"/>
  <text x="140" y="175" text-anchor="middle" class="t">Web Portal / UI</text>
  <text x="140" y="193" text-anchor="middle" class="s">Troshka Next.js</text>

  <rect x="60" y="226" width="160" height="56" rx="6" fill="#FFF5F5" stroke="#C9190B" stroke-width="1.5"/>
  <text x="140" y="249" text-anchor="middle" class="t">Demo Lab Portal</text>
  <text x="140" y="267" text-anchor="middle" class="s">Token-scoped URL</text>

  <rect x="60" y="300" width="160" height="56" rx="6" fill="#F5F5F5" stroke="#8A8D90" stroke-width="1.5"/>
  <text x="140" y="323" text-anchor="middle" class="t">Browser Consoles</text>
  <text x="140" y="341" text-anchor="middle" class="s">noVNC / MegaConsole</text>

  <!-- Control plane -->
  <rect x="280" y="100" width="340" height="160" rx="10" fill="#FFFFFF" stroke="#D2D2D2" stroke-width="1.5"/>
  <rect x="280" y="100" width="340" height="36" rx="10" fill="#E7F1FA"/>
  <rect x="280" y="120" width="340" height="16" fill="#E7F1FA"/>
  <text x="450" y="124" text-anchor="middle" class="h">Control Plane (EKS / OpenShift)</text>

  <rect x="300" y="152" width="140" height="44" rx="6" fill="#232F3E"/>
  <text x="370" y="178" text-anchor="middle" class="t-inv">Troshka API</text>

  <rect x="460" y="152" width="140" height="44" rx="6" fill="#232F3E"/>
  <text x="530" y="178" text-anchor="middle" class="t-inv">PostgreSQL</text>

  <rect x="300" y="208" width="300" height="36" rx="6" fill="#F4F8FC" stroke="#8C9BAB" stroke-width="1"/>
  <text x="450" y="230" text-anchor="middle" class="s">Orchestrates hosts · patterns · labs · consoles</text>

  <!-- S3 -->
  <rect x="660" y="100" width="280" height="160" rx="10" fill="#FFFFFF" stroke="#D2D2D2" stroke-width="1.5"/>
  <rect x="660" y="100" width="280" height="36" rx="10" fill="#EAF5EA"/>
  <rect x="660" y="120" width="280" height="16" fill="#EAF5EA"/>
  <text x="800" y="124" text-anchor="middle" class="h">Amazon S3 — Pattern Store</text>

  <rect x="680" y="152" width="240" height="88" rx="6" fill="#F3FAF3" stroke="#3F8624" stroke-width="1.5"/>
  <text x="800" y="180" text-anchor="middle" class="t">Compressed disk images</text>
  <text x="800" y="198" text-anchor="middle" class="t">+ VM / topology metadata</text>
  <text x="800" y="220" text-anchor="middle" class="s">Build once → restore many</text>

  <!-- VPC -->
  <rect x="280" y="300" width="1080" height="460" rx="12" fill="#FFFFFF" stroke="#FF9900" stroke-width="2"/>
  <rect x="280" y="300" width="1080" height="40" rx="12" fill="#FFF8EF"/>
  <rect x="280" y="324" width="1080" height="16" fill="#FFF8EF"/>
  <text x="420" y="326" class="h">Amazon VPC — compute placement</text>
  <text x="1280" y="326" text-anchor="end" class="s">NestedVirtualization=enabled · C8i / M8i / R8i</text>

  <rect x="300" y="360" width="90" height="28" rx="14" fill="#FF9900"/>
  <text x="345" y="379" text-anchor="middle" class="t">EIP</text>
  <rect x="640" y="360" width="90" height="28" rx="14" fill="#FF9900"/>
  <text x="685" y="379" text-anchor="middle" class="t">EIP</text>
  <text x="980" y="379" class="tiny">EIPs attach to Troshka hosts (not nested VMs)</text>

  <!-- Host A -->
  <rect x="300" y="400" width="300" height="330" rx="10" fill="#F7F9FC" stroke="#232F3E" stroke-width="1.5"/>
  <rect x="300" y="400" width="300" height="34" rx="10" fill="#232F3E"/>
  <rect x="300" y="418" width="300" height="16" fill="#232F3E"/>
  <text x="450" y="423" text-anchor="middle" class="t-inv">EC2 Host A · troshkad</text>

  <rect x="318" y="450" width="264" height="125" rx="8" fill="#FFFFFF" stroke="#C9190B" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="450" y="470" text-anchor="middle" class="lbl">Lab Project 1 (isolated netns)</text>
<rect x="343.0" y="484" width="62" height="40" rx="4" fill="#FFE8E8" stroke="#C9190B" stroke-width="1.5"/>
<text x="374.0" y="509" text-anchor="middle" class="vm">VM</text>
<rect x="419.0" y="484" width="62" height="40" rx="4" fill="#FFE8E8" stroke="#C9190B" stroke-width="1.5"/>
<text x="450.0" y="509" text-anchor="middle" class="vm">VM</text>
<rect x="495.0" y="484" width="62" height="40" rx="4" fill="#FFE8E8" stroke="#C9190B" stroke-width="1.5"/>
<text x="526.0" y="509" text-anchor="middle" class="vm">SNO</text>
  <text x="450" y="555" text-anchor="middle" class="tiny">Internal DHCP · DNS · VXLAN</text>

  <rect x="318" y="590" width="264" height="120" rx="8" fill="#FFFFFF" stroke="#C9190B" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="450" y="610" text-anchor="middle" class="lbl">Lab Project 2</text>
<rect x="343.0" y="628" width="62" height="40" rx="4" fill="#FFE8E8" stroke="#C9190B" stroke-width="1.5"/>
<text x="374.0" y="653" text-anchor="middle" class="vm">VM</text>
<rect x="419.0" y="628" width="62" height="40" rx="4" fill="#FFE8E8" stroke="#C9190B" stroke-width="1.5"/>
<text x="450.0" y="653" text-anchor="middle" class="vm">VM</text>
<rect x="495.0" y="628" width="62" height="40" rx="4" fill="#FFE8E8" stroke="#C9190B" stroke-width="1.5"/>
<text x="526.0" y="653" text-anchor="middle" class="vm">VM</text>

  <!-- Host B -->
  <rect x="640" y="400" width="300" height="330" rx="10" fill="#F7F9FC" stroke="#232F3E" stroke-width="1.5"/>
  <rect x="640" y="400" width="300" height="34" rx="10" fill="#232F3E"/>
  <rect x="640" y="418" width="300" height="16" fill="#232F3E"/>
  <text x="790" y="423" text-anchor="middle" class="t-inv">EC2 Host B · troshkad</text>

  <rect x="658" y="450" width="264" height="125" rx="8" fill="#FFFFFF" stroke="#C9190B" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="790" y="470" text-anchor="middle" class="lbl">Lab Project 3</text>
<rect x="683.0" y="484" width="62" height="40" rx="4" fill="#FFE8E8" stroke="#C9190B" stroke-width="1.5"/>
<text x="714.0" y="509" text-anchor="middle" class="vm">VM</text>
<rect x="759.0" y="484" width="62" height="40" rx="4" fill="#FFE8E8" stroke="#C9190B" stroke-width="1.5"/>
<text x="790.0" y="509" text-anchor="middle" class="vm">VM</text>
<rect x="835.0" y="484" width="62" height="40" rx="4" fill="#FFE8E8" stroke="#C9190B" stroke-width="1.5"/>
<text x="866.0" y="509" text-anchor="middle" class="vm">SNO</text>
  <text x="790" y="555" text-anchor="middle" class="tiny">No cloud creds inside nested VMs</text>

  <rect x="658" y="590" width="264" height="120" rx="8" fill="#FFFFFF" stroke="#8A8D90" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="790" y="640" text-anchor="middle" class="s">Capacity for more labs</text>
  <text x="790" y="660" text-anchor="middle" class="tiny">Scale hosts up/down with demand</text>

  <!-- Optional -->
  <rect x="980" y="400" width="360" height="330" rx="10" fill="#FAFAFA" stroke="#8A8D90" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1160" y="430" text-anchor="middle" class="h">Optional / supporting</text>
  <rect x="1000" y="455" width="320" height="70" rx="6" fill="#FFFFFF" stroke="#8A8D90"/>
  <text x="1160" y="485" text-anchor="middle" class="t">Amazon FSx for OpenZFS</text>
  <text x="1160" y="505" text-anchor="middle" class="s">Shared pools · live migration</text>
  <rect x="1000" y="545" width="320" height="70" rx="6" fill="#FFFFFF" stroke="#8A8D90"/>
  <text x="1160" y="575" text-anchor="middle" class="t">Amazon EBS</text>
  <text x="1160" y="595" text-anchor="middle" class="s">Host volumes · auto-extend</text>
  <rect x="1000" y="635" width="320" height="70" rx="6" fill="#FFFFFF" stroke="#8A8D90"/>
  <text x="1160" y="665" text-anchor="middle" class="t">troshka-vncd</text>
  <text x="1160" y="685" text-anchor="middle" class="s">Console relay on each host</text>

  <!-- Arrows -->
  <line x1="240" y1="180" x2="298" y2="174" stroke="#C9190B" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="255" y="168" class="arrow">HTTPS</text>

  <path d="M 140 356 C 140 380, 200 390, 298 410" fill="none" stroke="#C9190B" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-red)"/>
  <text x="160" y="400" class="arrow">Console path</text>

  <!-- Agent API: label in the gap above the VPC bar; line drops left of the title -->
  <line x1="370" y1="260" x2="370" y2="288" stroke="#232F3E" stroke-width="1.8"/>
  <path d="M 370 288 L 330 288 L 330 398" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="378" y="282" class="arrow">Agent API</text>
  <path d="M 530 260 L 530 288 L 790 288 L 790 398" fill="none" stroke="#232F3E" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>

  <line x1="620" y1="174" x2="658" y2="174" stroke="#3F8624" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="658" y1="194" x2="620" y2="194" stroke="#3F8624" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="625" y="160" class="arrow">Patterns</text>

  <!-- Capture/restore: route right of S3, label clear of the VPC header -->
  <path d="M 800 260 L 800 275 L 960 275 L 960 398" fill="none" stroke="#3F8624" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="810" y="268" class="arrow">Capture / restore</text>

  <text x="40" y="800" class="tiny">Nested labs share EC2 hosts · cloud networking stays on the host (EIP/VPC) · patterns live in S3 · end users never receive cloud credentials</text>
</svg>
