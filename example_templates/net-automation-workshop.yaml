name: net-automation-workshop
display_name: "Network Automation Workshop"
description: >-
  Ansible Network Automation Workshop on Troshka — AAP control node, vscode
  showroom, and four multi-vendor router VMs (IOS-XE, Arista EOS, Juniper
  vSRX). Replaces the monolithic containerlab VM with direct vmNodes on a
  shared lab L2 segment. VM tags AnsibleGroup feed the Troshka Ansible
  inventory plugin (connection_mode troshka; no bastion). Router day-0
  config (IP + SSH) is applied once via bootstrap/configure-routers.yml
  serial console, then captured in a pattern.
category: workshop
install_method: agent
deploy_time: "~15 min"

networks:
  mgmt:
    cidr: 10.0.0.0/24
    dhcp: true
    gateway: true
    domain: workshop.local
    dns_records:
      - name: control.workshop.local
        target: control
      - name: vscode.workshop.local
        target: vscode
      - name: showroom.workshop.local
        target: showroom
  lab:
    cidr: 172.20.20.0/24
    dhcp: true

gateway:
  network: mgmt
  external_access: true
  outbound_ports: [53, 80, 443, 123, icmp]
  port_forwards:
  # Only Showroom is exposed externally; AAP (/aap/) and VS Code (/vscode/) are
  # proxied by the showroom nginx sidecar on the lab network.
    - ext_port: 80
      int_ip: 10.0.0.5
      int_port: 80

vms:
  control:
    vcpus: 4
    ram_gb: 32
    os: rhel
    firmware: uefi
    cloud_init: true
    login_user: rhel
    cloud_user_password: ansible123!  # pragma: allowlist secret
    user_data: |
      runcmd:
        - echo "PasswordAuthentication yes" > /etc/ssh/sshd_config.d/50-cloud-init.conf
        - systemctl reload sshd
    tags:
      AnsibleGroup: workshop_control,aap
    disks:
      - size_gb: 50
        library_item_name: aap-2.6-2-ceh-20251103
    nics:
      - network: mgmt
        model: virtio
        ip: 10.0.0.10
      - network: lab
        model: virtio
        ip: 172.20.20.5

  vscode:
    vcpus: 2
    ram_gb: 8
    os: rhel
    firmware: uefi
    cloud_init: true
    login_user: rhel
    cloud_user_password: ansible123!  # pragma: allowlist secret
    user_data: |
      runcmd:
        - echo "PasswordAuthentication yes" > /etc/ssh/sshd_config.d/50-cloud-init.conf
        - systemctl reload sshd
    tags:
      AnsibleGroup: workshop_vscode
    disks:
      - size_gb: 40
        library_item_name: rhel-9.6
    nics:
      - network: mgmt
        model: virtio
        ip: 10.0.0.20

  rtr1:
    vcpus: 4
    ram_gb: 8
    os: blank
    firmware: bios
    serial_exec: ios
    tags:
      AnsibleGroup: routers,cisco_iosxe
    disks:
      - size_gb: 20
        library_item_name: c8000v-rhdp-8g
    nics:
      - network: lab
        model: virtio
        ip: 172.20.20.10

  rtr2:
    vcpus: 2
    ram_gb: 4
    os: blank
    firmware: bios
    serial_exec: eos
    tags:
      AnsibleGroup: routers,arista_eos
    disks:
      - size_gb: 10
        library_item_name: veos-lab-4.32.0F
    nics:
      - network: lab
        model: virtio
        ip: 172.20.20.20

  rtr3:
    vcpus: 2
    ram_gb: 12
    os: blank
    firmware: bios
    serial_exec: junos
    tags:
      AnsibleGroup: routers,juniper_junos
    disks:
      - size_gb: 10
        library_item_name: junos-vsrx3-23.2R2.21
    nics:
      - network: lab
        model: virtio
        ip: 172.20.20.30

  rtr4:
    vcpus: 2
    ram_gb: 4
    os: blank
    firmware: bios
    serial_exec: eos
    tags:
      AnsibleGroup: routers,arista_eos
    disks:
      - size_gb: 10
        library_item_name: veos-lab-4.32.0F
    nics:
      - network: lab
        model: virtio
        ip: 172.20.20.40
showroom:
  enabled: true
  content_repo: https://github.com/rhpds/zt-network-automation-workshop.git
  content_ref: v0.0.1
  build_content: true

start_order:
  - vm: control
  - vm: vscode
  - vm: rtr1
  - vm: rtr2
  - vm: rtr3
  - vm: rtr4
  - container: showroom
    delay: 15

containers:
  showroom:
    type: pod
    build_content: true
    nics:
      - network: mgmt
        ip: 10.0.0.5
    disks:
      - size_gb: 5
        mount_path: /showroom
    init_containers:
      - name: git-cloner
        image: quay.io/rhpds/git-cloner:v1.1.4
        env:
          GIT_REPO_URL: https://github.com/rhpds/zt-network-automation-workshop.git
          GIT_REPO_REF: v0.0.1
          CLONE_DIR: /showroom/repo
        mounts:
          - disk: showroom-vol0
            mount_path: /showroom
      - name: config-overlay
        image: quay.io/rhpds/busybox:1.36
        env:
          UI_CONFIG_B64: ""  # pragma: allowlist secret
          USER_DATA_B64: "LS0tCmJhc3Rpb25fcGFzc3dvcmQ6IGFuc2libGUxMjMhCg=="  # pragma: allowlist secret
          NGINX_B64: ""  # pragma: allowlist secret
        command:
          - /bin/sh
          - -ec
          - |
            mkdir -p /showroom/user-data /showroom/nginx /showroom/repo
            echo "$UI_CONFIG_B64" | base64 -d > /showroom/repo/ui-config.yml
            echo "$USER_DATA_B64" | base64 -d > /showroom/user-data/user-data.yml
            echo "$NGINX_B64" | base64 -d > /showroom/nginx/nginx.conf
        mounts:
          - disk: showroom-vol0
            mount_path: /showroom
      - name: antora-builder
        image: quay.io/rhpds/antora:v1.2.2
        env:
          FILES_DIR: /showroom/repo
          OUTPUT_DIR: /showroom/www
          ANTORA_PLAYBOOK: site.yml
          ZT_UI_ENABLED: "true"
          ZT_BUNDLE: https://github.com/rhpds/nookbag/releases/download/nookbag-v0.3.2/nookbag-v0.3.2.zip
        mounts:
          - disk: showroom-vol0
            mount_path: /showroom
    containers:
      - name: proxy
        image: quay.io/rhpds/nginx:1.25
        cpus: 1
        memory_mb: 256
        ports: [80]
        command: ["nginx", "-c", "/showroom/nginx/nginx.conf", "-g", "daemon off;"]
        mounts:
          - disk: showroom-vol0
            mount_path: /showroom
      - name: content
        image: quay.io/rhpds/showroom-content:v1.4.1
        cpus: 1
        memory_mb: 256
        ports: [8000]
        command:
          - /bin/sh
          - -ec
          - ln -sf /showroom/user-data /user_data && exec /entrypoint.sh
        env:
          ANTORA_PLAYBOOK: site.yml
          ZT_BUNDLE: https://github.com/rhpds/nookbag/releases/download/nookbag-v0.3.2/nookbag-v0.3.2.zip
          ZT_UI_ENABLED: "true"
          GUID: workshop
          DOMAIN: workshop.local
        mounts:
          - disk: showroom-vol0
            mount_path: /showroom
      - name: wetty-control
        image: quay.io/rhpds/wetty:v2.5
        cpus: 1
        memory_mb: 512
        ports: [8001]
        command:
          - --base=/wetty_control/
          - --port=8001
          - --ssh-host=10.0.0.10
          - --ssh-port=22
          - --ssh-user=rhel
          - --ssh-auth=password
          - --ssh-pass=ansible123!
      - name: wetty-vscode
        image: quay.io/rhpds/wetty:v2.5
        cpus: 1
        memory_mb: 512
        ports: [8002]
        command:
          - --base=/wetty_vscode/
          - --port=8002
          - --ssh-host=10.0.0.20
          - --ssh-port=22
          - --ssh-user=rhel
          - --ssh-auth=password
          - --ssh-pass=ansible123!
