system {
    host-name rtr3;
    root-authentication {
        plain-text-password-value "admin@123";  # pragma: allowlist secret
    }
    login {
        user admin {
            class super-user;
            authentication {
                plain-text-password-value "admin@123";  # pragma: allowlist secret
            }
        }
    }
    services {
        ssh {
            root-login allow;
        }
        netconf {
            ssh;
        }
    }
}
interfaces {
    fxp0 {
        unit 0 {
            family inet {
                address 172.20.20.30/24;
            }
        }
    }
}
