apiVersion: v1
kind: Namespace
metadata:
  name: troshka
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: troshka
  namespace: troshka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: troshka-provider
rules:
  # KubeVirt VMs — full lifecycle
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["create", "delete", "get", "list", "patch"]
  # KubeVirt VMIs — read + delete (delete for restart/force-stop)
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    verbs: ["get", "list", "delete"]
  # KubeVirt subresources — VNC console, serial console, exec
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances", "virtualmachineinstances/vnc", "virtualmachineinstances/console", "virtualmachineinstances/exec"]
    verbs: ["get"]
  # Pause/unpause — Hosts UI "Resume" for IO-error / admin-paused guests
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachineinstances/pause", "virtualmachineinstances/unpause"]
    verbs: ["update"]
  # Live migrate — Hosts UI "Live Migrate" (VirtualMachineInstanceMigration)
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstancemigrations"]
    verbs: ["create", "delete", "get", "list", "watch"]
  # CDI DataVolumes — created via VM dataVolumeTemplates
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["create", "delete", "get", "list"]
  # Services — NodePort for SSH/agent, ClusterIP for vncd, EIP port forwards
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  # MetalLB IPAddressPools — read external-IP capacity for placement (max_eips)
  - apiGroups: ["metallb.io"]
    resources: ["ipaddresspools"]
    verbs: ["get", "list"]
  # PVCs — Ceph-NFS storage pools, extend
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete", "get", "list", "patch"]
  # PVs — read NFS endpoint from bound PV
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list"]
  # Routes — console edge termination (patch/update: _create_or_get_route
  # merge-patches the route spec on 409 conflict, e.g. on re-deploy)
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  # routes/custom-host — set an explicit spec.host on app-proxy routes
  # (deterministic public hostnames for the embedded OCP console/oauth)
  - apiGroups: ["route.openshift.io"]
    resources: ["routes/custom-host"]
    verbs: ["create", "update"]
  # Cluster network config — read OVN MTU for uplink-aware MTU selection
  - apiGroups: ["config.openshift.io"]
    resources: ["networks", "ingresses"]
    verbs: ["get", "list"]
  # IngressController — resolve apps domain for the admin-selected controller
  # (default vs ingress-rhdp-net → apps.<cluster>.rhdp.net)
  - apiGroups: ["operator.openshift.io"]
    resources: ["ingresscontrollers"]
    verbs: ["get", "list"]
  # Secrets — cloud-init userdata; list needed to strip stuck finalizers on destroy
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "list", "patch"]
  # Namespace — ensure troshka namespace exists; patch guid for secondary ICs
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "delete", "patch"]
  # Nodes — find IPs for NodePort access
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # Pods — find Rook toolbox for ceph commands, operator helper pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list"]
  # Pod exec — run ceph CLI in Rook toolbox (NFS export management)
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  # ConfigMaps — dnsmasq config for kubevirt native
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete", "get", "list"]
  # CRDs — install/update Troshka CRDs only (create stays unscoped: resourceNames
  # does not apply to create; deploy-full Step 3b is the preferred apply path).
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create", "get", "list"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - troshkaprojects.troshka.redhat.com
      - troshkanetworks.troshka.redhat.com
      - troshkavms.troshka.redhat.com
      - troshkancephs.troshka.redhat.com
    verbs: ["get", "list", "patch", "delete", "update"]
  # Troshka CRDs — kubevirt native operator
  - apiGroups: ["troshka.redhat.com"]
    resources: ["troshkaprojects", "troshkanetworks", "troshkavms", "troshkancephs"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: ["troshka.redhat.com"]
    resources: ["troshkaprojects/status", "troshkanetworks/status", "troshkavms/status", "troshkancephs/status"]
    verbs: ["get", "patch"]
  - apiGroups: ["troshka.redhat.com"]
    resources: ["troshkaprojects/finalizers", "troshkanetworks/finalizers", "troshkavms/finalizers", "troshkancephs/finalizers"]
    verbs: ["update"]
  # Rook Ceph — preflight (get/list any) + destroy finalizer strip only on
  # Troshka's fixed CR names (never ODF/platform CephClusters).
  - apiGroups: ["ceph.rook.io"]
    resources: ["cephclusters", "cephblockpools"]
    verbs: ["get", "list"]
  - apiGroups: ["ceph.rook.io"]
    resources: ["cephclusters"]
    resourceNames: ["troshka-ceph"]
    verbs: ["patch", "delete"]
  - apiGroups: ["ceph.rook.io"]
    resources: ["cephblockpools"]
    resourceNames: ["troshka-ceph-pool"]
    verbs: ["patch", "delete"]
  # Deployments — operator install only (name-scoped mutate)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["troshka-operator"]
    verbs: ["get", "list", "patch", "delete", "update"]
  # RBAC — provider only VERIFIES admin-bootstrapped ClusterRole/Binding
  # (see _verify_cluster_rbac); never create/replace (escalation prevention).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get"]
  # ServiceAccounts — operator + provider bootstrap (name-scoped mutate)
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["troshka", "troshka-operator"]
    verbs: ["get", "delete"]
  # NetworkAttachmentDefinitions — kubevirt native OVN networks
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["net-attach-defs"]
    verbs: ["create", "delete", "get", "list"]
  # VolumeSnapshots — pattern capture (patch clears stuck finalizers on destroy)
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "delete", "get", "list", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "patch", "delete"]
  # Jobs — guestfish, PXE init, pattern export
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list"]
  # Events — operator progress reporting
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: troshka-provider
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: troshka-provider
subjects:
  - kind: ServiceAccount
    name: troshka
    namespace: troshka
---
# Custom SCC for exec into virt-launcher pods (guest-agent exec).
# Mirrors kubevirt-controller SCC: RunAsAny uid/fsGroup, NET_BIND_SERVICE
# + SYS_NICE caps, KubeVirt seccomp profile. No hostPID/hostNetwork/hostIPC.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: troshka-virt-exec
allowHostDirVolumePlugin: true
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: false
allowedCapabilities:
  - SYS_NICE
  - NET_BIND_SERVICE
fsGroup:
  type: RunAsAny
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
seccompProfiles:
  - runtime/default
  - unconfined
  - localhost/kubevirt/kubevirt.json
supplementalGroups:
  type: RunAsAny
volumes:
  - "*"
users:
  - system:serviceaccount:troshka:troshka
---
# Privileged SCC for recert Jobs — needs qemu-nbd device access, mount (SYS_ADMIN),
# and SELinux RunAsAny to access disk content. Used by troshka-recert SA per project namespace.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: troshka-privileged-jobs
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: true
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: true
allowedCapabilities:
  - SYS_ADMIN
  - NET_ADMIN
fsGroup:
  type: RunAsAny
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
  - downwardAPI
users: []
---
# OpenShift normally auto-creates system:openshift:scc:<name> ClusterRoles so
# RoleBindings can grant `use` of an SCC. On some clusters (e.g. ocpv06) the
# kubevirt-controller CR is missing even though the SCC exists. Binding to a
# missing ClusterRole poisons ALL auth for the subject SA in that namespace
# (destroy finalizer strip, console exec, etc.). Ensure the CR explicitly.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:openshift:scc:kubevirt-controller
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["kubevirt-controller"]
    verbs: ["use"]
