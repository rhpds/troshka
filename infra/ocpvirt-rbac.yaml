apiVersion: v1
kind: Namespace
metadata:
  name: troshka
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: troshka
  namespace: troshka
---
# Cluster-scoped + cluster-wide READ for the provider SA.
# Namespaced MUTATE lives in troshka-provider-namespaced (RoleBinding per NS).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: troshka-provider
rules:
  # Namespace lifecycle (project NS create/delete)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "delete", "patch", "list"]
  # Nodes — NodePort / placement
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # PVs — NFS endpoint / orphan cleanup (cluster-scoped)
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list"]
  # Services list cluster-wide — EIP capacity scan (list_service_for_all_namespaces)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  # MetalLB IPAddressPools
  - apiGroups: ["metallb.io"]
    resources: ["ipaddresspools"]
    verbs: ["get", "list"]
  # Cluster network / ingress config
  - apiGroups: ["config.openshift.io"]
    resources: ["networks", "ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["operator.openshift.io"]
    resources: ["ingresscontrollers"]
    verbs: ["get", "list"]
  # CRDs — install/update Troshka CRDs (create unscoped; mutate name-scoped)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create", "get", "list"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - troshkaprojects.troshka.redhat.com
      - troshkanetworks.troshka.redhat.com
      - troshkavms.troshka.redhat.com
      - troshkancephs.troshka.redhat.com
    verbs: ["get", "list", "patch", "delete", "update"]
  # Verify admin-bootstrapped ClusterRole/Binding; bind namespaced roles into project NS
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames:
      - troshka-provider-namespaced
      - troshka-operator-namespaced
      - system:openshift:scc:kubevirt-controller
  # Create per-NS RoleBindings (chicken-egg before namespaced role exists in that NS)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create", "get", "list"]
  # VolumeSnapshotContents are cluster-scoped
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "patch", "delete"]
  # Rook preflight read (any NS); mutate is on troshka-provider-namespaced
  - apiGroups: ["ceph.rook.io"]
    resources: ["cephclusters", "cephblockpools"]
    verbs: ["get", "list"]
---
# Namespaced mutate for provider SA — granted only via RoleBinding in troshka-* NSs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: troshka-provider-namespaced
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["create", "delete", "get", "list", "patch"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances", "virtualmachineinstances/vnc", "virtualmachineinstances/console", "virtualmachineinstances/exec"]
    verbs: ["get"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachineinstances/pause", "virtualmachineinstances/unpause"]
    verbs: ["update"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstancemigrations"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete", "get", "list", "patch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes/custom-host"]
    verbs: ["create", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: ["troshka.redhat.com"]
    resources: ["troshkaprojects", "troshkanetworks", "troshkavms", "troshkancephs"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: ["troshka.redhat.com"]
    resources: ["troshkaprojects/status", "troshkanetworks/status", "troshkavms/status", "troshkancephs/status"]
    verbs: ["get", "patch"]
  - apiGroups: ["troshka.redhat.com"]
    resources: ["troshkaprojects/finalizers", "troshkanetworks/finalizers", "troshkavms/finalizers", "troshkancephs/finalizers"]
    verbs: ["update"]
  - apiGroups: ["ceph.rook.io"]
    resources: ["cephclusters"]
    resourceNames: ["troshka-ceph"]
    verbs: ["patch", "delete"]
  - apiGroups: ["ceph.rook.io"]
    resources: ["cephblockpools"]
    resourceNames: ["troshka-ceph-pool"]
    verbs: ["patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["troshka-operator"]
    verbs: ["get", "list", "patch", "delete", "update"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["troshka", "troshka-operator"]
    verbs: ["get", "delete"]
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["net-attach-defs"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "delete", "get", "list", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: troshka-provider
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: troshka-provider
subjects:
  - kind: ServiceAccount
    name: troshka
    namespace: troshka
---
# Custom SCC for exec into virt-launcher pods (guest-agent exec).
# Mirrors kubevirt-controller SCC: RunAsAny uid/fsGroup, NET_BIND_SERVICE
# + SYS_NICE caps, KubeVirt seccomp profile. No hostPID/hostNetwork/hostIPC.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: troshka-virt-exec
allowHostDirVolumePlugin: true
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: false
allowedCapabilities:
  - SYS_NICE
  - NET_BIND_SERVICE
fsGroup:
  type: RunAsAny
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
seccompProfiles:
  - runtime/default
  - unconfined
  - localhost/kubevirt/kubevirt.json
supplementalGroups:
  type: RunAsAny
volumes:
  - "*"
users:
  - system:serviceaccount:troshka:troshka
---
# Privileged SCC for recert Jobs — needs qemu-nbd device access, mount (SYS_ADMIN),
# and SELinux RunAsAny to access disk content. Used by troshka-recert SA per project namespace.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: troshka-privileged-jobs
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: true
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: true
allowedCapabilities:
  - SYS_ADMIN
  - NET_ADMIN
fsGroup:
  type: RunAsAny
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
  - downwardAPI
users: []
---
# OpenShift normally auto-creates system:openshift:scc:<name> ClusterRoles so
# RoleBindings can grant `use` of an SCC. On some clusters (e.g. ocpv06) the
# kubevirt-controller CR is missing even though the SCC exists. Binding to a
# missing ClusterRole poisons ALL auth for the subject SA in that namespace
# (destroy finalizer strip, console exec, etc.). Ensure the CR explicitly.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:openshift:scc:kubevirt-controller
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["kubevirt-controller"]
    verbs: ["use"]
