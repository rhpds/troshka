sonar.projectKey=com.redhat.rhpds.troshka
sonar.qualitygate.wait=false

sonar.python.version=3.11

sonar.sources=src/backend/app,src/troshkad,src/operator
sonar.tests=src/backend/tests,src/operator/tests,src/troshkad/tests

sonar.exclusions=\
  .github/**,\
  deploy/**,\
  node_modules/**,\
  src/frontend/**,\
  scripts/**,\
  infra/**,\
  **/__pycache__/**,\
  **/alembic/versions/**,\
  **/tests/**,\
  **/conftest.py,\
  src/operator/crds/**,\
  src/operator/deploy/**,\
  src/operator/operator.py,\
  src/operator/images/vnc-proxy/**

sonar.test.inclusions=\
  **/tests/**/*.py,\
  **/test_*.py,\
  **/conftest.py

# coverage-N.xml from GitLab parallel test-backend shards (see .gitlab-ci.yml)
sonar.python.coverage.reportPaths=coverage-*.xml,coverage-heavy.xml,coverage.xml,operator-coverage.xml,troshkad-coverage.xml

# Ops-pod EE: pip packages and ansible collection are version/commit-pinned in the
# Dockerfile, but Sonar S8544 requires hashed lockfiles we do not maintain here.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S8544
sonar.issue.ignore.multicriteria.e1.resourceKey=**/ops-pod/Dockerfile
