app:
  name: troshka
  port: 8200
  host: "0.0.0.0"
  log_level: info
  root_path: ""
  external_url: ""

database:
  url: "postgresql+psycopg2://troshka:troshka@localhost:5433/troshka"

redis:
  url: "redis://localhost:6379/0"

auth:
  jwt_secret: "CHANGE-ME-IN-LOCAL-CONFIG"
  jwt_algorithm: "HS256"
  jwt_expiry_hours: 24
  oauth_enabled: false
  allow_registration: true
  admin_users: "prutledg@redhat.com"
  allowed_users: ""
  operator_users: ""
  allowed_groups: ""
  admin_groups: ""
  operator_groups: ""

app_update:
  mode: auto          # auto | dev | image | disabled
  registry: quay.io
  repo: redhat-gpte
  tag: production
  poll_interval: 300

aws:
  default_region: "us-east-1"
  default_instance_type: "m8i.xlarge"

defaults:
  run_timer_hours: 8
  lifetime_days: 30
  max_vms_per_project: 20
  max_projects_per_user: 10
  user_library_quota_gb: 500

overcommit:
  cpu_ratio: 4.0
  ram_ratio: 1.5

gc:
  cache_stale_hours_patterns: 24
  cache_stale_hours_snapshots: 1
  cache_stale_hours_images: 5

central_s4:
  # Soft ceiling for central S4 (troshka-images). Sync jobs refuse to copy a
  # pattern when synced central bytes + pattern size would exceed this value.
  # Null / omitted = no ceiling (guard disabled).
  max_bytes: null

health:
  interval_seconds: 30
  disconnect_after_seconds: 90

# OCP Virt dedicated-CI: HTTP package repo (replaces per-host RHEL DVD ISO import).
# Password belongs in config.local.yaml or TROSHKA_OCPVIRT__PKG_REPO__PASSWORD.
ocpvirt:
  pkg_repo:
    url: "https://repo-troshka-images.apps.ocpv-infra01.dal12.infra.demo.redhat.com/rhel-10.2"
    username: troshka-repo
    password: ""
    route_host: "repo-troshka-images.apps.ocpv-infra01.dal12.infra.demo.redhat.com"
    iso_library_item_name: "RHEL 10.2 Binary DVD"

# OpenShift agent-based install options.
#   install_via_pod: when true, single-cluster OCP projects install via the
#     in-cluster ops pod instead of a bastion VM (multi-cluster always uses the
#     ops pod). Default false so the bastion path stays default until Plan 4b.
#   ops_pod_image: overrides the ops-pod execution-environment image ref.
ocp:
  install_via_pod: false
  ops_pod_image: ""
