name: example
display_name: "Example Template"
description: "Minimal single-VM smoke template. Prefers RHEL 10 KVM guest image, falls back to Fedora Cloud."
category: example
deploy_time: "~5 min"

networks:
  mgmt:
    cidr: 10.0.0.0/24
    dhcp: true
    gateway: true

gateway:
  outbound_ports: [53, 80, 443, 123, icmp]

vms:
  demo:
    vcpus: 2
    ram_gb: 4
    os: rhel10
    firmware: uefi
    cloud_init: true
    disks:
      - size_gb: 40
        library_item_name: "RHEL 10.2 KVM Guest Image|Fedora Cloud 43"
    isos:
      - name: dvd
        library_item_name: "RHEL 10.2 Binary DVD|"
    nics:
      - network: mgmt
        model: virtio
        ip: 10.0.0.10
