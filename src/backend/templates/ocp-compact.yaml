name: ocp-compact
display_name: "OpenShift Compact 3-Node (Agent Installer)"
description: "3 combined CP + worker nodes — 4 vCPU, 16 GB, 120 GB each"
category: openshift
install_method: agent
deploy_time: "~25 min"
versions: ["4.14", "4.15", "4.16", "4.17", "4.18"]

ocp:
  - name: ocp
    type: compact
    base_domain: ocp.local
    api_vip: 10.0.0.2
    ingress_vip: 10.0.0.3

gateway:
  outbound_ports:
    - 53
    - 80
    - 443
    - 123
    - icmp

networks:
  cluster:
    cidr: 10.0.0.0/24
    gateway: true
    domain: ocp.local
    dns_records:
      - name: api.ocp.ocp.local
        ip: 10.0.0.2
      - name: api-int.ocp.ocp.local
        ip: 10.0.0.2
      - name: .apps.ocp.ocp.local
        ip: 10.0.0.3
  bmc:
    type: bmc
    cidr: 192.168.100.0/24

vms:
  bastion:
    role: bastion
    vcpus: 2
    ram_gb: 4
    os: rhel
    disks:
      - size_gb: 80
    nics:
      - network: cluster
        ip: 10.0.0.50
      - network: bmc

  cp-0:
    role: control-plane
    vcpus: 4
    ram_gb: 16
    os: rhcos
    firmware: uefi
    bmc: true
    bmc_ip: 192.168.100.10
    disks:
      - size_gb: 120
    nics:
      - network: cluster
        ip: 10.0.0.10

  cp-1:
    role: control-plane
    vcpus: 4
    ram_gb: 16
    os: rhcos
    firmware: uefi
    bmc: true
    bmc_ip: 192.168.100.11
    disks:
      - size_gb: 120
    nics:
      - network: cluster
        ip: 10.0.0.11

  cp-2:
    role: control-plane
    vcpus: 4
    ram_gb: 16
    os: rhcos
    firmware: uefi
    bmc: true
    bmc_ip: 192.168.100.12
    disks:
      - size_gb: 120
    nics:
      - network: cluster
        ip: 10.0.0.12

showroom:
  enabled: true
  dns_network: cluster        # resolves *.apps.ocp.ocp.local -> ingress VIP
  content_repo: https://github.com/rhpds/showroom-troshka-ocp-base.git
  content_ref: main
  build_content: true
  disk_gb: 5
  tabs:
    - name: Bastion Terminal
      type: terminal
      vm: bastion
      network: cluster
    # App-proxy: embed the OCP console in the showroom iframe. Deploy mints a
    # public route per host (browser can't resolve .local), and nginx rewrites
    # console<->oauth redirects public<->.local while leaving the OAuth
    # redirect_uri .local so the cluster's OAuthClient still validates.
    # proxy_hosts[0] is the iframe target; the rest are login companions.
    - name: OCP Console
      type: proxy
      proxy_hosts:
        - console-openshift-console.apps.ocp.ocp.local   # iframe target
        - oauth-openshift.apps.ocp.ocp.local             # login companion
      proxy_port: 443
      proxy_tls: true
