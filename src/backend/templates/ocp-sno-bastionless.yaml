name: ocp-sno-bastionless
display_name: "OpenShift SNO — Bastionless (Ops Pod)"
description: "Single Node OpenShift installed in-cluster via the ops pod — no bastion VM. 8 vCPU, 32 GB RAM, 120 GB + 250 GB container storage"
category: openshift
install_method: agent
# Bastionless: the in-cluster ops pod runs the agent install and drives status
# (no bastion VM). See docs/dev/deploy-pipeline.md + Plan 4b.
install_via: pod
deploy_time: "~20 min"
versions: ["4.14", "4.15", "4.16", "4.17", "4.18"]

ocp:
  - name: ocp
    type: sno
    base_domain: local
    api_vip: 10.0.0.10
    ingress_vip: 10.0.0.10

gateway:
  outbound_ports:
    - 53
    - 80/tcp
    - 443/tcp
    - 123/udp

networks:
  cluster:
    cidr: 10.0.0.0/24
    gateway: true
    domain: local
    dns_records:
      - name: api.ocp.local
        ip: 10.0.0.10
      - name: api-int.ocp.local
        ip: 10.0.0.10
      - name: .apps.ocp.local
        ip: 10.0.0.10
  bmc:
    type: bmc
    cidr: 192.168.100.0/24

vms:
  cp-0:
    role: control-plane
    vcpus: 8
    ram_gb: 32
    os: rhcos
    firmware: uefi
    bmc: true
    bmc_ip: 192.168.100.10
    recert: true
    disks:
      - size_gb: 120
      - size_gb: 250
        ocp_mount: /var/lib/containers
    nics:
      - network: cluster
        ip: 10.0.0.10

showroom:
  enabled: true
  dns_network: cluster        # resolves *.apps.ocp.local -> ingress VIP
  content_repo: https://github.com/rhpds/showroom-troshka-ocp-base.git
  content_ref: main
  build_content: true
  disk_gb: 5
  tabs:
    # App-proxy: embed the OCP console in the showroom iframe. Deploy mints a
    # public route per host (browser can't resolve .local), and nginx rewrites
    # console<->oauth redirects public<->.local while leaving the OAuth
    # redirect_uri .local so the cluster's OAuthClient still validates.
    # proxy_hosts[0] is the iframe target; the rest are login companions.
    - name: OCP Console
      type: proxy
      proxy_hosts:
        - console-openshift-console.apps.ocp.local   # iframe target
        - oauth-openshift.apps.ocp.local             # login companion
      proxy_port: 443
      proxy_tls: true
