name: ocp-standard
display_name: "OpenShift Standard 3+2 (Agent Installer)"
description: "3 CP (4 vCPU, 16 GB, 120 GB) + 2 workers (4 vCPU, 16 GB, 120 GB)"
category: openshift
install_method: agent
# The in-cluster ops pod runs the agent install and drives status (no bastion
# VM). See docs/dev/deploy-pipeline.md + Plan 4b.
install_via: pod
deploy_time: "~30 min"
versions: ["4.19", "4.20", "4.21", "4.22"]

ocp:
  - name: ocp
    type: standard
    ocp_version: "4.22"
    base_domain: local
    api_vip: 10.0.0.2
    ingress_vip: 10.0.0.3

gateway:
  outbound_ports:
    - 53
    - 80
    - 443
    - 123
    - icmp

networks:
  cluster:
    cidr: 10.0.0.0/24
    gateway: true
    domain: local
    dns_records:
      - name: api.ocp.local
        ip: 10.0.0.2
      - name: api-int.ocp.local
        ip: 10.0.0.2
      - name: .apps.ocp.local
        ip: 10.0.0.3
  bmc:
    type: bmc
    cidr: 192.168.100.0/24

vms:
  cp-0:
    role: control-plane
    vcpus: 4
    ram_gb: 16
    os: rhcos
    firmware: uefi
    bmc: true
    bmc_ip: 192.168.100.10
    disks:
      - size_gb: 120
    nics:
      - network: cluster
        ip: 10.0.0.10

  cp-1:
    role: control-plane
    vcpus: 4
    ram_gb: 16
    os: rhcos
    firmware: uefi
    bmc: true
    bmc_ip: 192.168.100.11
    disks:
      - size_gb: 120
    nics:
      - network: cluster
        ip: 10.0.0.11

  cp-2:
    role: control-plane
    vcpus: 4
    ram_gb: 16
    os: rhcos
    firmware: uefi
    bmc: true
    bmc_ip: 192.168.100.12
    disks:
      - size_gb: 120
    nics:
      - network: cluster
        ip: 10.0.0.12

  worker-0:
    role: worker
    vcpus: 4
    ram_gb: 16
    os: rhcos
    firmware: uefi
    bmc: true
    bmc_ip: 192.168.100.20
    disks:
      - size_gb: 120
    nics:
      - network: cluster
        ip: 10.0.0.20

  worker-1:
    role: worker
    vcpus: 4
    ram_gb: 16
    os: rhcos
    firmware: uefi
    bmc: true
    bmc_ip: 192.168.100.21
    disks:
      - size_gb: 120
    nics:
      - network: cluster
        ip: 10.0.0.21

showroom:
  enabled: true
  dns_network: cluster        # resolves *.apps.ocp.local -> ingress VIP
  content_repo: https://github.com/rhpds/showroom-troshka-ocp-base.git
  content_ref: main
  build_content: true
  disk_gb: 5
  tabs:
    # Bastionless cluster terminal: an in-showroom oc shell (unprivileged, no
    # sudo) with every deployed cluster's kubeconfig pre-installed — replaces a
    # bastion VM. `target: clusters` makes it a local shell (no VM/SSH); an
    # init container fetches oc and the deploy injects the merged kubeconfig.
    - type: terminal
      target: clusters
      name: OpenShift Cluster Terminal
    # Cluster-managed OCP console tab (app-proxy): linking to cluster "ocp" lets
    # the loader derive the tab name and proxy hosts (console + oauth) from the
    # cluster, exactly like the canvas "+ OpenShift Console Proxy Tab" quick-add.
    # It then auto-syncs on cluster rename / base-domain change. Deploy mints a
    # public route per host (browser can't resolve .local), and nginx rewrites
    # console<->oauth redirects public<->.local while leaving the OAuth
    # redirect_uri .local so the cluster's OAuthClient still validates.
    - type: proxy
      cluster: ocp
      proxy_port: 443
      proxy_tls: true
