apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: troshkancephs.troshka.redhat.com
spec:
  group: troshka.redhat.com
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [cephId, networkNad, labIp, capacityGi]
              properties:
                cephId:
                  type: string
                networkNad:
                  type: string
                labIp:
                  type: string
                labPrefixLength:
                  type: integer
                  default: 24
                capacityGi:
                  type: integer
                  minimum: 50
                osdCount:
                  type: integer
                  minimum: 1
                  maximum: 6
                  default: 3
                replicateSize:
                  type: integer
                  minimum: 1
                  maximum: 3
                linkedClusterIds:
                  type: array
                  items:
                    type: string
                storageClassName:
                  type: string
                  default: troshka-ceph-rbd
                osdStorageClass:
                  type: string
                restore:
                  type: object
                  description: >-
                    Restore-mode adoption of pre-created mon/OSD PVCs from a
                    captured pattern (see docs/dev/project-ceph-pattern-restore.md).
                    Rook has no CephCluster field to "attach" a PVC by name; it
                    adopts the mon PVC by its fixed name and OSD PVCs by
                    ceph.rook.io/DeviceSet* labels stamped on the claims before
                    this CR is created. This block is consumed by
                    build_ceph_cluster() to cap the OSD device-set count at the
                    number of already-adopted PVCs (monPvc/osdPvcs values are
                    otherwise traceability metadata, not literal attach refs).
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    monPvc:
                      type: string
                    osdPvcs:
                      type: array
                      items:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: OSDs
          type: integer
          jsonPath: .spec.osdCount
        - name: Mon
          type: string
          jsonPath: .status.monEndpoint
  scope: Namespaced
  names:
    plural: troshkancephs
    singular: troshkanceph
    kind: TroshkaCeph
    shortNames: [tc]
