apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: troshkavms.troshka.redhat.com
spec:
  group: troshka.redhat.com
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [vmId, name, cpus, memory]
              properties:
                vmId:
                  type: string
                name:
                  type: string
                cpus:
                  type: integer
                memory:
                  type: integer
                firmware:
                  type: string
                  enum: [bios, uefi, uefi-secure]
                  default: bios
                smbiosUuid:
                  type: string
                os:
                  type: string
                powerOnAtDeploy:
                  type: boolean
                  default: true
                bootOrder:
                  type: array
                  items:
                    x-kubernetes-preserve-unknown-fields: true
                disks:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                nics:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                cloudInit:
                  type: object
                  properties:
                    userData:
                      type: string
                    networkConfig:
                      type: string
                recertEnabled:
                  type: boolean
                  default: false
                bmcEnabled:
                  type: boolean
                  default: false
                bmcIp:
                  type: string
                cdrom:
                  type: object
                  properties:
                    libraryIsoId:
                      type: string
                    s3Path:
                      type: string
                    central:
                      type: boolean
                      default: false
                guestfishCommands:
                  type: array
                  items:
                    type: string
                videoModel:
                  type: string
                  enum: [virtio, vga, qxl]
                  default: virtio
                inputModel:
                  type: string
                  enum: [virtio, usb, ps2]
                  default: virtio
                serialModel:
                  type: string
                  enum: [virtio, isa]
                  default: isa
                serialConsole:
                  type: boolean
                  default: true
                serialExecType:
                  type: string
                  description: >-
                    Serial exec handler for Troshka API (linux, ios, eos, junos).
                    vEOS (serialExecType eos) enables headless mode (no VGA) in the operator.
                headless:
                  type: boolean
                  description: >-
                    When true, omit graphics device so network OS writes to serial console.
                legacyRootBus:
                  type: boolean
                  description: >-
                    Place NICs on the q35 root PCI bus (0000:00:03.0, …) instead of
                    PCIe root ports. Required for some network OS images (e.g. vEOS) on KubeVirt.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: State
          type: string
          jsonPath: .status.state
        - name: VM Name
          type: string
          jsonPath: .spec.name
  scope: Namespaced
  names:
    plural: troshkavms
    singular: troshkavm
    kind: TroshkaVM
    shortNames: [tvm]
