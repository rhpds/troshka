apiVersion: apps/v1
kind: Deployment
metadata:
  name: troshka-operator
  namespace: troshka-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: troshka-operator
  template:
    metadata:
      labels:
        app: troshka-operator
    spec:
      serviceAccountName: troshka-operator
      containers:
        - name: operator
          image: quay.io/redhat-gpte/troshka-operator:production
          imagePullPolicy: Always
          command: ["kopf", "run", "main.py", "--verbose", "--all-namespaces", "--standalone"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: IMAGE_TAG
              value: production
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 2Gi
